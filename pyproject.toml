[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macos-computer-use"
version = "0.1.0"
description = "LLM-free macOS desktop automation primitives for agent applications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Zhang Hao" }
]
keywords = ["macos", "automation", "computer-use", "agent-tools", "accessibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/zhanghao1903/macos-computer-use"
Repository = "https://github.com/zhanghao1903/macos-computer-use"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
macos_computer_use = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
