[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-desktop-tool"
version = "0.1.1"
description = "Protocol-first WeChat Desktop semantic tools for app-control clients."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Zhang Hao" }
]
dependencies = [
  "app-control-protocol>=0.1.0",
]
keywords = ["wechat", "desktop", "automation", "app-control", "agent-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.optional-dependencies]
accessibility = [
  "pyobjc-core>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
wechat-desktop-tool = "wechat_desktop_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wechat_desktop_tool = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
