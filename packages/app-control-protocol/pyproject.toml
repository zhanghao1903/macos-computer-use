[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "app-control-protocol"
version = "0.3.0"
description = "Shared command, observation, event, error, and config contracts for app-control tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Zhang Hao" }
]
keywords = ["automation", "computer-use", "app-control", "protocol", "agent-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.__pycache__", "*.__pycache__.*"]

[tool.setuptools.package-data]
app_control_protocol = ["py.typed", "schemas/*.schema.json"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
